<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fin du match 9–2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Saira:wght@400;500&display=swap">
<style>
  /* Layout: one floodlit stage, the screenshot is the whole show; caption and replay sit underneath. */
  :root {
    --night: #060a1c;      /* scoreboard navy, darkened */
    --navy: #121a5c;       /* the stats panel navy */
    --yellow: #e9e400;     /* eFootball yellow */
    --pitch: #1d5a2a;
    --fg: #eef0ff;
    --muted: #8f96c4;
    --display: "Saira Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Saira", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--fg);
    font-family: var(--body);
    overflow-x: hidden;
  }
  .stage {
    position: relative;
    min-height: 100%;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    align-content: center;
    gap: clamp(16px, 3vw, 28px);
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    isolation: isolate;
  }
  /* Floodlights: two soft beams that switch on before the photo lands */
  .stage::before {
    content: "";
    position: absolute; inset: 0; z-index: -1;
    background:
      radial-gradient(60% 50% at 15% 0%, rgb(233 228 0 / .16), transparent 70%),
      radial-gradient(60% 50% at 85% 0%, rgb(233 228 0 / .16), transparent 70%),
      radial-gradient(80% 45% at 50% 110%, color-mix(in srgb, var(--pitch) 55%, transparent), transparent 70%);
    animation: lights 1.1s ease-out both;
  }

  .eyebrow {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(13px, 1.6vw, 16px);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--yellow);
    animation: rise .6s .2s ease-out both;
  }

  .frame {
    width: min(1100px, 100%);
    max-width: 100%;
    aspect-ratio: 1600 / 720;
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgb(233 228 0 / .35),
      0 30px 80px -20px rgb(0 0 0 / .8),
      0 0 120px -30px rgb(233 228 0 / .35);
    cursor: zoom-in;
    transform-origin: 50% 50%;
    animation: arrive 1.5s .45s cubic-bezier(.16, 1.1, .3, 1) both;
  }
  .frame img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    transform-origin: var(--ox, 50%) var(--oy, 50%);
    animation: drift 9s 2s ease-in-out infinite alternate;
    transition: transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  .frame.zoomed { cursor: zoom-out; }
  .frame.zoomed img { animation: none; transform: scale(2.2); }

  .score {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(28px, 5vw, 48px);
    line-height: 1;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: .4em;
    animation: rise .6s 1.6s ease-out both;
  }
  .score b {
    background: var(--yellow); color: var(--navy);
    padding: .08em .3em; border-radius: 4px;
  }
  .score span { color: var(--muted); font-weight: 600; }

  .controls {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 20px;
    font-size: 14px; color: var(--muted);
    animation: rise .6s 1.9s ease-out both;
  }
  button {
    font: 600 15px/1 var(--display);
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--navy); background: var(--yellow);
    border: 0; border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible, .frame:focus-visible { outline: 3px solid var(--fg); outline-offset: 4px; }

  @keyframes lights { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes arrive {
    0%   { opacity: 0; transform: perspective(1200px) rotateX(18deg) scale(.3); filter: blur(14px) brightness(2); }
    55%  { opacity: 1; filter: blur(0) brightness(1.15); }
    100% { opacity: 1; transform: perspective(1200px) rotateX(0) scale(1); filter: none; }
  }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.07); } }

  /* "lkwaaaaaaa 😂" bubbles popping in along both sides */
  .stage { overflow: hidden; }
  .lkwa {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    white-space: nowrap;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(18px, 2.6vw, 34px);
    color: var(--yellow);
    text-shadow: 0 3px 0 var(--navy), 0 0 18px rgb(233 228 0 / .45);
    animation: pop 2.4s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  .lkwa.left  { left: var(--x); }
  .lkwa.right { right: var(--x); }
  @keyframes pop {
    0%   { opacity: 0; transform: rotate(var(--r)) scale(0); }
    18%  { opacity: 1; transform: rotate(var(--r)) scale(1.25); }
    30%  { transform: rotate(calc(var(--r) * -1)) scale(1); }
    42%  { transform: rotate(var(--r)) scale(1.08); }
    80%  { opacity: 1; transform: rotate(var(--r)) scale(1) translateY(-10px); }
    100% { opacity: 0; transform: rotate(var(--r)) scale(.6) translateY(-40px); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main class="stage" id="stage">
  <p class="eyebrow">Fin du match</p>
  <div class="frame" id="frame" tabindex="0" role="button" aria-label="Zoom into the match stats">
    <img src="photo.jpg" alt="eFootball full-time stats: إتحاد الزغنغن 9, لحراااادة 2. Possession 56% to 44%, shots 13 to 11, passes 219 to 211." width="1600" height="720">
  </div>
  <p class="score"><b>9</b><span>–</span><b>2</b></p>
  <div class="controls">
    <button type="button" id="replay">Replay</button>
    <span>Tap the photo to zoom in</span>
  </div>
</main>

<script>
  const frame = document.getElementById('frame');
  const img = frame.querySelector('img');

  function toggleZoom(x, y) {
    if (!frame.classList.contains('zoomed')) {
      img.style.setProperty('--ox', x + '%');
      img.style.setProperty('--oy', y + '%');
    }
    frame.classList.toggle('zoomed');
  }
  frame.addEventListener('click', e => {
    const r = frame.getBoundingClientRect();
    toggleZoom((e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100);
  });
  frame.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleZoom(50, 50); }
  });

  // Restart every CSS animation on the page from the beginning
  document.getElementById('replay').addEventListener('click', () => {
    frame.classList.remove('zoomed');
    document.getAnimations().forEach(a => { a.cancel(); a.play(); });
  });

  // Pop "lkwaaaaaaa 😂" on alternating sides once the photo has landed
  const stage = document.getElementById('stage');
  let side = 0;
  function popLkwa() {
    const el = document.createElement('span');
    el.className = 'lkwa ' + (side++ % 2 ? 'right' : 'left');
    el.textContent = Math.random() < .5 ? 'lkwaaaaaaa 😂' : '😂 lkwaaaaaaa 😂';
    el.style.top = (5 + Math.random() * 82) + '%';
    el.style.setProperty('--x', (1 + Math.random() * 6) + '%');
    el.style.setProperty('--r', (Math.random() * 30 - 15) + 'deg');
    el.setAttribute('aria-hidden', 'true');
    el.addEventListener('animationend', () => el.remove());
    stage.appendChild(el);
  }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setTimeout(() => { popLkwa(); setInterval(popLkwa, 550); }, 1600);
  }
</script>
</body>
</html>
